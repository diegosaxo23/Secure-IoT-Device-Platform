# Operational MQTT broker with mutual X.509 certificate authentication.

persistence true
persistence_location /mosquitto/data/
autosave_interval 60

log_dest stdout
log_type error
log_type warning
log_type notice
log_type information
connection_messages true
log_timestamp true

sys_interval 10

listener 8883 0.0.0.0
protocol mqtt
allow_anonymous false
allow_zero_length_clientid false

cafile /mosquitto/certs/ca/ca.crt
certfile /mosquitto/certs/broker/broker.crt
keyfile /mosquitto/certs/broker/broker.key
crlfile /pki-src/crl/ca.crl
require_certificate true
use_identity_as_username true
# The certificate CN becomes the MQTT username, and Mosquitto then replaces
# the client supplied Client ID with that username. This makes the effective
# broker Client ID equal to the authenticated certificate CN.
use_username_as_clientid true

acl_file /mosquitto/config/acl

max_packet_size 1048576
max_queued_messages 1000
