version: 2
updates:
  - package-ecosystem: "pip"
    directory: "/server"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
  - package-ecosystem: "docker"
    directory: "/server"
    schedule:
      interval: "monthly"
  - package-ecosystem: "docker"
    directory: "/simulators"
    schedule:
      interval: "monthly"
  - package-ecosystem: "docker"
    directory: "/broker"
    schedule:
      interval: "monthly"
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "monthly"
