name: Bug report
description: Report a reproducible non-security defect
title: "[Bug]: "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Do not report security vulnerabilities here. Follow SECURITY.md for private reporting.
  - type: input
    id: version
    attributes:
      label: Version
      placeholder: "1.0.0"
    validations:
      required: true
  - type: dropdown
    id: component
    attributes:
      label: Component
      options:
        - ESP32 firmware
        - Manufacturing Agent
        - Provisioning API / Dashboard
        - PKI / Revocation
        - MQTT broker
        - Simulation Manager
        - Installer / Startup
        - Documentation
        - Other
    validations:
      required: true
  - type: textarea
    id: description
    attributes:
      label: Description
      description: What happened and what did you expect?
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Steps to reproduce
      placeholder: "1. ...\n2. ...\n3. ..."
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: OS, ESP32 profile/board, Docker/PlatformIO versions when relevant.
  - type: textarea
    id: logs
    attributes:
      label: Sanitized logs
      description: Remove Wi-Fi credentials, passwords, bootstrap secrets, private keys and other sensitive data.
