name: Tests

on:
  push:
    branches: ["main", "master"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  python-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: "pip"
          cache-dependency-path: |
            Secure-IoT-Device-Platform/server/requirements.txt
            Secure-IoT-Device-Platform/scripts/requirements-factory.txt

      - name: Install test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r Secure-IoT-Device-Platform/server/requirements.txt

      - name: Check public source tree
        run: python scripts/check_public_tree.py

      - name: Compile Python sources
        run: python -m compileall -q server scripts simulators tests

      - name: Run unit and integration tests
        env:
          PYTHONPATH: server
        run: pytest -q

      - name: Validate Docker Compose configuration
        run: docker compose config --quiet
