name: Tests

on:
  push:
    branches: ["main", "master"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  python-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: "pip"
          cache-dependency-path: |
            server/requirements.txt
            scripts/requirements-factory.txt

      - name: Install test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r server/requirements.txt

      - name: Check public source tree
        run: python scripts/check_public_tree.py

      - name: Compile Python sources
        run: python -m compileall -q server scripts simulators tests

      - name: Run unit and integration tests
        env:
          PYTHONPATH: server
        run: pytest -q

      - name: Validate Docker Compose configuration
        run: docker compose config --quiet

  firmware-builds:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        project:
          - CromaLED_Gateway
          - AS7341_Gateway
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install PlatformIO
        run: |
          python -m pip install --upgrade pip
          python -m pip install "platformio>=6.1,<7"

      - name: Build ${{ matrix.project }}
        run: python -m platformio run -d "firmware/esp32/${{ matrix.project }}" -e esp32dev
