[platformio]
default_envs = esp32dev
src_dir = src

[env:esp32dev]
platform = espressif32 @ 7.0.1
board = esp32dev
framework = arduino
monitor_speed = 115200
board_build.partitions = partitions.csv
board_build.filesystem = littlefs
lib_deps =
  https://github.com/bblanchon/ArduinoJson/archive/refs/tags/v7.4.2.zip
  https://github.com/knolleary/pubsubclient/archive/refs/tags/v2.8.zip
build_flags =
  -Wall
  -Wextra
  -DCORE_DEBUG_LEVEL=0
  -DARDUINO_LOOP_STACK_SIZE=24576
